<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=17">
<link rel="stylesheet" href="pulse-enhancements.css?v=3">
<link rel="stylesheet" href="only-text-mode.css?v=5">
<link rel="stylesheet" href="welcome.css?v=2">
</head>
<body>
<a class="skip-link" href="#main">Перейти к содержимому</a>

<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Навигация">
    <a class="brand" href="#/" aria-label="Pulse, главная">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="13" width="3" height="6" rx="1.5" fill="currentColor" opacity=".45"/>
        <rect x="8" y="9" width="3" height="14" rx="1.5" fill="currentColor" opacity=".7"/>
        <rect x="14" y="4" width="3" height="24" rx="1.5" fill="currentColor"/>
        <rect x="20" y="9" width="3" height="14" rx="1.5" fill="currentColor" opacity=".7"/>
        <rect x="26" y="13" width="3" height="6" rx="1.5" fill="currentColor" opacity=".45"/>
      </svg>
      <span class="brand-name">Pulse</span>
    </a>

    <nav class="nav" aria-label="Разделы">
      <a class="nav-item" href="#/" data-route="home">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-7H9v7H3z"/></svg>
        <span>Главная</span>
      </a>
      <a class="nav-item" href="#/search" data-route="search">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Поиск</span>
      </a>
      <a class="nav-item" href="#/collection" data-route="collection">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17l-7-4-7 4z"/></svg>
        <span>Коллекция</span>
      </a>
      <a class="nav-item" href="#/wave" data-route="wave">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.4"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 16.2a6 6 0 0 0 0-8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 19.1a10 10 0 0 0 0-14.2"/></svg>
        <span>Моя волна</span>
      </a>
    </nav>

    <div class="nav-group">
      <p class="nav-title">Коллекция</p>
      <a class="nav-sub" href="#/collection/likes" data-route="likes">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-4.9-8-10a4.6 4.6 0 0 1 8-2.9A4.6 4.6 0 0 1 20 11c0 5.1-8 10-8 10z"/></svg>
        <span>Любимые треки</span>
      </a>
      <a class="nav-sub" href="#/collection/recent" data-route="recent">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Недавно прослушанные</span>
      </a>
      <a class="nav-sub" href="#/collection/artists" data-route="artists">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
        <span>Подписки</span>
      </a>
    </div>

    <div class="sidebar-foot">
      <section class="pw-acct" id="pwAccount" aria-label="Аккаунт"></section>
      <a class="contact" href="https://t.me/stesha_me" target="_blank" rel="noopener">Связаться с нами: @stesha_me</a>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn nav-back" id="navBack" type="button" aria-label="Назад" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <button class="icon-btn nav-forward" id="navForward" type="button" aria-label="Вперёд" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <div class="topbar-search">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="quickSearch" type="search" placeholder="Поиск" autocomplete="off" aria-label="Поиск">
      </div>
      <button class="icon-btn otm-toggle-btn" id="otmSwitch" type="button" aria-label="Режим «Только текст»" aria-pressed="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h13"/></svg>
      </button>
      <button class="icon-btn" id="openSettings" type="button" aria-label="Настройки">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
      </button>
    </header>

    <main class="main" id="main" tabindex="-1">
      <div class="page" id="page" data-page="home"></div>
    </main>

    <footer class="site-foot">
      <span>Pulse — музыкальный плеер</span>
      <a href="https://t.me/stesha_me" target="_blank" rel="noopener">Связаться с нами: @stesha_me</a>
    </footer>
  </div>
</div>

<!-- Плеер -->
<section class="player" id="player" aria-label="Сейчас играет">
  <div class="player-track">
    <div class="player-cover" id="playerCover">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    </div>
    <div class="player-meta">
      <p class="player-title" id="playerTitle">Сейчас играет</p>
      <p class="player-artist" id="playerArtist">Выберите трек</p>
    </div>
    <button class="icon-btn player-like" id="btnLike" type="button" aria-label="Лайк" aria-pressed="false">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-4.9-8-10a4.6 4.6 0 0 1 8-2.9A4.6 4.6 0 0 1 20 11c0 5.1-8 10-8 10z"/></svg>
    </button>
  </div>

  <div class="player-center">
    <div class="player-controls">
      <button class="icon-btn" id="btnShuffle" type="button" aria-label="Перемешать" aria-pressed="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h4l10 12h4M3 18h4L17 6h4"/><path d="m18 3 3 3-3 3M18 15l3 3-3 3"/></svg>
      </button>
      <button class="icon-btn" id="btnPrev" type="button" aria-label="Назад">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14L8 12z"/><path d="M5 5v14"/></svg>
      </button>
      <button class="play-btn" id="btnPlay" type="button" aria-label="Слушать">
        <svg class="ico icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
        <svg class="ico icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
      </button>
      <button class="icon-btn" id="btnNext" type="button" aria-label="Далее">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14l10-7z"/><path d="M19 5v14"/></svg>
      </button>
      <button class="icon-btn" id="btnRepeat" type="button" aria-label="Повтор" aria-pressed="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l4 4-4 4"/><path d="M3 11V9a2 2 0 0 1 2-2h16"/><path d="M7 21l-4-4 4-4"/><path d="M21 13v2a2 2 0 0 1-2 2H3"/></svg>
        <span class="repeat-one">1</span>
      </button>
    </div>
    <div class="player-progress">
      <span class="time" id="timeNow">0:00</span>
      <div class="progress" id="progress" role="slider" tabindex="0" aria-label="Позиция трека" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
        <div class="progress-buffer" id="progressBuffer"></div>
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-knob" id="progressKnob"></div>
      </div>
      <span class="time" id="timeEnd">0:00</span>
    </div>
  </div>

  <div class="player-side">
    <button class="icon-btn" id="btnQueue" type="button" aria-label="Очередь">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h11M4 12h11M4 17h7"/><path d="M18 9v8"/></svg>
    </button>
    <button class="icon-btn" id="btnDevice" type="button" aria-label="Устройство">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16v-4a8 8 0 0 1 16 0v4"/><path d="M4 16h3v4H4zM17 16h3v4h-3z"/></svg>
    </button>
    <div class="volume">
      <button class="icon-btn" id="btnMute" type="button" aria-label="Без звука">
        <svg class="ico icon-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M18 6a8 8 0 0 1 0 12"/></svg>
        <svg class="ico icon-vol-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
      </button>
      <div class="volume-bar" id="volumeBar" role="slider" tabindex="0" aria-label="Громкость" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
        <div class="volume-fill" id="volumeFill"></div>
      </div>
    </div>
  </div>

  <button class="player-handle" id="playerHandle" type="button" aria-label="Развернуть плеер">
    <span></span>
  </button>
</section>

<nav class="mobile-nav" aria-label="Нижняя навигация">
  <a href="#/" data-route="home" class="mobile-nav-item">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-7H9v7H3z"/></svg>
    <span>Главная</span>
  </a>
  <a href="#/search" data-route="search" class="mobile-nav-item">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span>Поиск</span>
  </a>
  <a href="#/collection" data-route="collection" class="mobile-nav-item">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17l-7-4-7 4z"/></svg>
    <span>Коллекция</span>
  </a>
  <a href="#/wave" data-route="wave" class="mobile-nav-item">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.4"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 16.2a6 6 0 0 0 0-8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 19.1a10 10 0 0 0 0-14.2"/></svg>
    <span>Моя волна</span>
  </a>
</nav>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modalRoot"></div>

<div id="ytHost" aria-hidden="true"></div>

<script type="module" src="js/mobile-audio-unlock.js?v=1"></script>
<script type="module" src="app.js?v=18"></script>
<script type="module" src="ui-enhancements.js?v=2"></script>
<script type="module" src="only-text-mode.js?v=4"></script>
<script type="module" src="welcome.js?v=2"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
